services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: miniaturayt:latest
    container_name: miniaturayt-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
